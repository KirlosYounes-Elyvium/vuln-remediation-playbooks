---
- name: Apply pending OS security updates
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  vars:
    allow_reboot: false

  tasks:
    - name: Ensure unattended-upgrades is installed
      apt:
        name: unattended-upgrades
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Run security-only unattended-upgrade
      command: unattended-upgrade -v
      register: uu_result
      changed_when: "'Packages that will be upgraded' in uu_result.stdout or 'Packages that are upgraded' in uu_result.stdout"
      when: ansible_os_family == "Debian"

    - name: Show what was upgraded
      debug:
        var: uu_result.stdout_lines
      when: ansible_os_family == "Debian"

    - name: Check whether a reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_os_family == "Debian"

    - name: Reboot when required and explicitly allowed
      reboot:
        msg: "Rebooting after automated security patch run"
        reboot_timeout: 600
      when:
        - ansible_os_family == "Debian"
        - reboot_required_file.stat.exists
        - allow_reboot | bool
